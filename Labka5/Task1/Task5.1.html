<!DOCTYPE html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lab 5.1 – План подорожі</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="travel-plan">
      <h1>План подорожі</h1>
      <ul class="plan-list">   
        <li class="stage">
          <span class="stage-title">Підготовчий етап</span>      
          <ul class="sub-list">
            <li class="icon-route"><span>Обрати маршрут</span></li>
            <li class="icon-ticket"><span>Квитки на літак</span></li>
            <li class="icon-hotel"><span>Готель</span></li>
            <li class="icon-car"><span>Оренда авто</span></li>
          </ul>
        </li>
        <li class="stage">
          <span class="stage-title">Відпочинок</span>
          <ul class="sub-list">
            <li class="icon-bar"><span>Бари</span></li>
            <li class="icon-casino"><span>Казино</span></li>
            <li class="icon-museum"><span>Музей</span></li>
            <li class="icon-festival"><span>Фестивалі</span></li>
          </ul>
        </li>
      </ul>
    </div>
  </body>
</html>
